<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="wrapper">
    <div class="form-container login">
      <form name="Login">
        <h2>Login</h2>
        <div class="form-group">
          <input type="email" name="email" required>
          <img src="icons/envelope-solid.svg" alt="Email Icon" class="form-icon">
          <label>Email</label>
        </div>
        <div class="form-group">
          <input type="password" name="password" required>
          <img src="icons/lock-solid.svg" alt="Lock Icon" class="form-icon">
          <label>Password</label>
        </div>
        <button type="submit" class="btn">Login</button>
      </form>
    </div>
  </div>

  <!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<!-- Firebase Auth -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<!-- Firebase Firestore -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script>
    // Your Firebase config
    const firebaseConfig = {
  apiKey: "AIzaSyAGMdccU6qvGR9IJLwko6c6Kx77jdhDAV0",
  authDomain: "trashtrademarketplace-24011.firebaseapp.com",
  projectId: "trashtrademarketplace-24011",
  storageBucket: "trashtrademarketplace-24011.firebasestorage.app",
  messagingSenderId: "77243085731",
  appId: "1:77243085731:web:9d40959859718fd3696016"
};

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const form = document.forms['Login'];

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const loginBtn = form.querySelector('button');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      const email = form.email.value.trim();
      const password = form.password.value.trim();

      try {
        // Firebase login
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // Get username from Firestore
        const doc = await db.collection("users").doc(user.uid).get();
        const username = doc.exists ? doc.data().username : email;

        // Redirect to Buyer.html
        window.location.href = `Buyer.html?user=${encodeURIComponent(username)}`;
      } catch (error) {
        alert(error.message);
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
