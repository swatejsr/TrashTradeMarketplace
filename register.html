<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <div class="wrapper">
    <div class="form-container register">
      <form name="Register">
        <h2>Register</h2>
        <div class="form-group">
          <input type="text" name="username" required>
          <img src="icons/user-solid.svg" alt="User Icon" class="form-icon">
          <label>Username</label>
        </div>
        <div class="form-group">
          <input type="password" name="password" required>
          <img src="icons/lock-solid.svg" alt="Lock Icon" class="form-icon">
          <label>Password</label>
        </div>
        <div class="form-group">
          <input type="password" name="confirm-password" required>
          <img src="icons/lock-solid.svg" alt="Lock Icon" class="form-icon">
          <label>Confirm Password</label>
        </div>
        <div class="form-group">
          <input type="email" name="email" required>
          <img src="icons/envelope-solid.svg" alt="Email Icon" class="form-icon">
          <label>Email</label>
        </div>
        <button type="submit" class="btn">Register</button>
      </form>
    </div>
  </div>

  <!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<!-- Firebase Auth -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<!-- Firebase Firestore -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script>
    // Your Firebase config
    const firebaseConfig = {
  apiKey: "AIzaSyAGMdccU6qvGR9IJLwko6c6Kx77jdhDAV0",
  authDomain: "trashtrademarketplace-24011.firebaseapp.com",
  projectId: "trashtrademarketplace-24011",
  storageBucket: "trashtrademarketplace-24011.firebasestorage.app",
  messagingSenderId: "77243085731",
  appId: "1:77243085731:web:9d40959859718fd3696016"
};

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const form = document.forms['Register'];

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const loginBtn = form.querySelector('button');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Registering...';

      const username = form.username.value.trim();
      const email = form.email.value.trim();
      const password = form.password.value.trim();
      const confirmPassword = form['confirm-password'].value.trim();

      if (password !== confirmPassword) {
        alert("Passwords do not match!");
        loginBtn.disabled = false;
        loginBtn.textContent = 'Register';
        return;
      }

      try {
        // Create Firebase Auth user
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // Save extra info in Firestore
        await db.collection("users").doc(user.uid).set({
          username: username,
          email: email,
          createdAt: new Date()
        });

        // Redirect
        window.location.href = "login.html";
      } catch (error) {
        alert(error.message);
        loginBtn.disabled = false;
        loginBtn.textContent = 'Register';
      }
    });
  </script>
</body>
</html>
